services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ivenna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ivenna}
      POSTGRES_DB: ivenna
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ivenna -d ivenna"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
