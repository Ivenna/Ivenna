services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ivenna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ivenna}
      POSTGRES_DB: ivenna
      MEMORY_DATABASE_PASSWORD: ${MEMORY_DATABASE_PASSWORD:-ivenna_memory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres/init-memory.sh:/docker-entrypoint-initdb.d/10-memory.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ivenna -d ivenna"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
