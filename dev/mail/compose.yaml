name: ivenna-mail

services:
  mail:
    image: docker.io/stalwartlabs/stalwart:v1.0.2
    container_name: "${MAIL_CONTAINER_NAME:-ivenna-mail}"
    restart: unless-stopped
    volumes:
      - mail:/var/lib/stalwart
      - ./config.json:/etc/stalwart/config.json:ro,z
    ports:
      - "127.0.0.1:${MAIL_HTTP_PORT:-8088}:8080"
      - "127.0.0.1:${MAIL_SMTP_PORT:-2525}:2525"
    environment:
      STALWART_PUBLIC_URL: "http://127.0.0.1:${MAIL_HTTP_PORT:-8088}"
      STALWART_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz/live
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/healthz/live]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mail:
    external: true
    name: "${MAIL_VOLUME_NAME:-ivenna-mail}"
