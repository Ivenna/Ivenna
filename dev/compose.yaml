name: ivenna

services:
  mail:
    image: docker.io/stalwartlabs/stalwart:v1.0.2
    container_name: "${MAIL_CONTAINER_NAME:-ivenna-mail}"
    restart: unless-stopped
    volumes:
      - mail:/var/lib/stalwart
      - ./mail/config.json:/etc/stalwart/config.json:ro,z
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "127.0.0.1:${MAIL_HTTP_PORT:-8088}:8080"
      - "127.0.0.1:${MAIL_SMTP_PORT:-2525}:2525"
    environment:
      # Local health and reception checks must reach the service directly.
      NO_PROXY: localhost,127.0.0.1,host.containers.internal
      no_proxy: localhost,127.0.0.1,host.containers.internal
      STALWART_PUBLIC_URL: "http://127.0.0.1:${MAIL_HTTP_PORT:-8088}"
      STALWART_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz/live
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/healthz/live]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  memory:
    build:
      context: ..
      dockerfile: apps/memory/Containerfile
    image: "${MEMORY_IMAGE:-localhost/ivenna-memory:dev}"
    container_name: "${MEMORY_CONTAINER_NAME:-ivenna-memory}"
    restart: unless-stopped
    environment:
      MEMORY_CAPACITY_BYTES: "${MEMORY_CAPACITY_BYTES:-1073741824}"
    ports:
      - "127.0.0.1:${MEMORY_SSH_PORT:-2222}:22"
    volumes:
      - memory:/memory
      - ../.ivenna/dev-memory/id_ed25519.pub:/run/memory-client.pub:ro,Z
      - ../.ivenna/dev-memory/ssh_host_ed25519_key:/run/memory-host-key:ro,Z
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "22"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mail:
    external: true
    name: "${MAIL_VOLUME_NAME:-ivenna-mail}"
  memory:
    external: true
    name: "${MEMORY_VOLUME_NAME:-ivenna-memory}"
