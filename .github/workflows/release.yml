name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}
      - name: Test and package Ivenna
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="snapshot-$GITHUB_SHA"
          fi
          scripts/release.sh "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivenna-package
          path: dist/${{ steps.package.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ivenna-package
          path: dist
      - name: Publish the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          cd dist
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$version" --jq .sha)
          package_commit=$(jq -er .commit ./*.json)
          if [[ "$package_commit" != "$commit" ]]; then
            printf 'Cannot publish tag %s. It points to %s. The package was built from %s.\n' \
              "$version" "$commit" "$package_commit" >&2
            exit 1
          fi

          flags=(--verify-tag --generate-notes)
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$version" ./* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
